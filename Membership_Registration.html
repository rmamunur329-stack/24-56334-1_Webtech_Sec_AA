<!DOCTYPE html>
<html>
<head>
    <title>Membership Registration</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLkl16SiHkRd1pi0F6xWyvFgp5mSzoHbj-d7lTe3S_z9-Qg6AXxcUDLvc&s"/>
</head>

<body>

<h1>Library Membership Registration</h1>

<form action="" method="get">

    <label>Name:</label>
    <input type="text" name="name" placeholder="Enter your full name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" placeholder="example@domain.com" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="password" placeholder="Create a strong password" required>
    <br><br>

    <label>Age:</label>
    <input type="number" name="age" placeholder="Enter your age" required>
    <br><br>

    <label>Date of Birth:</label>
    <input type="date" name="dob" required>
    <br><br>

    <label>Gender:</label>

    <input type="radio" name="gender" id="male" value="Male" required>
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female" value="Female">
    <label for="female">Female</label>

    <br><br>

    <label>Membership Type:</label>

    <select name="membership" required>
        <option value="" disabled selected>Select membership type</option>
        <option value="Regular">Regular</option>
        <option value="Premium">Premium</option>
        <option value="Student">Student</option>
    </select>

    <br><br>

    <label>Profile Picture:</label>
    <input type="file" name="picture" required>

    <br><br>

    <label for="text area">Address:</label>
    <br>
    <textarea name="address" name="text area" rows="4" cols="30" placeholder="Enter your complete street address" required></textarea>

    <br><br>

    <input type="checkbox" name="terms" id="terms" required>
    <label for="terms">I agree to the Terms and Conditions</label>

    <br><br>

    <input type="submit" value="Register">

</form>

</body>
</html>
