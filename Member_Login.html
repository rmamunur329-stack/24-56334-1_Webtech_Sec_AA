<!DOCTYPE html>
<html>
<head>
    <title>Library Login</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLkl16SiHkRd1pi0F6xWyvFgp5mSzoHbj-d7lTe3S_z9-Qg6AXxcUDLvc&s"/>
</head>

<body>

<h1>Library Member Login</h1>

<form action="" method="get">

    <label>Email:</label>
    <input type="email" name="email" placeholder="example@domain.com" required>

    <br><br>

    <label>Password:</label>
    <input type="password" name="password" placeholder="Enter your password" required>

    <br><br>

    <label>Login As:</label>

    <select name="loginas" required>
        <option value="" disabled selected>Select your role</option>
        <option value="Member">Member</option>
        <option value="Librarian">Librarian</option>
    </select>

    <br><br>

    <input type="checkbox" name="remember" id="remember" required>
    <label for="remember">Remember Me</label>

    <br><br>

    <a href="Membership_Registration.html"target="_blank"> Membership Registration</a> 
    <br><br>

    <input type="submit" value="Login">
    <input type="reset" value="Reset">

</form>

</body>
</html>
